version: 2
updates:
- package-ecosystem: dotnet-sdk
  directory: "/"
  schedule:
    interval: monthly
- package-ecosystem: devcontainers
  directory: "/"
  schedule:
    interval: monthly
  groups:
    dependencies:
      patterns:
        - "*"
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: monthly
  groups:
    dependencies:
      patterns:
        - "*"
- package-ecosystem: nuget
  directory: "/"
  schedule:
    interval: monthly
  groups:
    dependencies:
      patterns:
        - "*"
- package-ecosystem: npm
  directory: "/src/RazorPagesProject"
  schedule:
    interval: monthly
  groups:
    dependencies:
      patterns:
        - "*"
